<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Касса — Пополнение и снятие</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Касса</h1>
      <p class="api-status" id="apiStatus">API: <span id="apiUrl"></span></p>
    </header>

    <div class="cards">
      <div class="card">
        <h2 class="card-title">Пополнение (Top-up)</h2>
        <form id="topUpForm" class="form">
          <div class="form-group">
            <label for="topUpAmount">Сумма</label>
            <input type="number" id="topUpAmount" name="amount" step="0.01" min="0.01" required placeholder="0.00">
          </div>
          <button type="submit" class="btn btn-primary">Пополнить</button>
          <div id="topUpMessage" class="message" aria-live="polite"></div>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">Снятие (Cashout)</h2>
        <form id="cashoutForm" class="form">
          <div class="form-group">
            <label for="cashoutAmount">Сумма</label>
            <input type="number" id="cashoutAmount" name="amount" step="0.01" min="0.01" required placeholder="0.00">
          </div>
          <button type="submit" class="btn btn-secondary">Снять</button>
          <div id="cashoutMessage" class="message" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
