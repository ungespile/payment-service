<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Payment Service</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Вход в систему</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Введите логин">
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Введите пароль">
      </div>
      <div id="loginError" class="login-error"></div>
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
