<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Payment Service</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="lang-switcher lang-switcher-login">
    <button type="button" class="lang-btn active" data-lang="ru" aria-label="Русский">RU</button>
    <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
  </div>
  <div class="login-card">
    <h1 data-i18n="login.formTitle">Вход в систему</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username" data-i18n="login.loginLabel">Логин</label>
        <input type="text" id="username" name="username" required autocomplete="username" data-i18n-placeholder="login.loginPlaceholder" placeholder="Введите логин">
      </div>
      <div class="form-group">
        <label for="password" data-i18n="login.passwordLabel">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="Введите пароль">
      </div>
      <div id="loginError" class="login-error"></div>
      <button type="submit" class="btn btn-primary" data-i18n="login.submitBtn">Войти</button>
    </form>
  </div>
  <script src="/js/i18n.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
